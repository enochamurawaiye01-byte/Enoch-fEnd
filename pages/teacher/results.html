<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results — Mercy T International College (MIC) ERP</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/responsive.css" />

<link rel="stylesheet" href="../../css/components/sidebar.css" />
<link rel="stylesheet" href="../../css/components/navbar.css" />
<link rel="stylesheet" href="../../css/components/buttons.css" />
<link rel="stylesheet" href="../../css/components/forms.css" />
<link rel="stylesheet" href="../../css/components/tables.css" />
<link rel="stylesheet" href="../../css/components/badges.css" />
<link rel="stylesheet" href="../../css/components/modal.css" />

</head>
<body data-page-title="Results" data-workspace="teacher">

<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Results</h1>
          <span class="page-head__desc">Enter scores only for your assigned classes and subjects.</span>
        </div>
        <div class="page-head__actions">
          <button type="button" class="btn btn-primary" id="save-term-results-btn">Save scores</button>
        </div>
      </div>
      <div class="table-wrap">
        <div class="table-toolbar">
          <select id="filter-session" aria-label="Academic session"><option value="">Select session</option></select>
          <select id="filter-term" aria-label="Term" disabled><option value="">Select term</option></select>
          <select id="filter-class" aria-label="Assigned class"><option value="">Select class</option></select>
          <select id="filter-subject" aria-label="Assigned subject"><option value="">Select subject</option></select>
          <button type="button" class="btn btn-secondary btn-sm" id="load-result-sheet-btn">Load students</button>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Student</th><th>Registration No.</th><th>1st CA</th><th>2nd CA</th><th>Examination</th><th>Total</th></tr></thead>
            <tbody id="results-tbody"><tr><td colspan="6">Select session, term, class and subject to load the roster.</td></tr></tbody>
          </table>
        </div>
        <div id="results-pagination"></div>
      </div>
    </main>

    <div class="app-footer-note">Mercy T International College (MIC) ERP</div>
  </div>
</div>

<script src="../../js/config/api.js"></script>
<script src="../../js/config/endpoints.js"></script>

<script src="../../js/services/students.js"></script>
<script src="../../js/services/subjects.js"></script>
<script src="../../js/services/terms.js"></script>
<script src="../../js/services/academic-sessions.js"></script>
<script src="../../js/services/classes.js"></script>
<script src="../../js/services/teacher-assignments.js"></script>
<script src="../../js/services/results.js"></script>
<script src="../../js/services/report-cards.js"></script>
<script src="../../js/services/auth.js"></script>
<script src="../../js/components/toast.js"></script>
<script src="../../js/components/loader.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/confirm-dialog.js"></script>
<script src="../../js/components/pagination.js"></script>
<script src="../../js/components/dropdown.js"></script>
<script src="../../js/components/notification.js"></script>
<script src="../../js/components/table.js"></script>
<script src="../../js/components/simple-crud.js"></script>
<script src="../../js/components/sidebar.js"></script>
<script src="../../js/components/navbar.js"></script>
<script src="../../js/auth/auth-guard.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/pages/results.js"></script>
</body>
</html>
