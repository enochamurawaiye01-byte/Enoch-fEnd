<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — Enoch International College ERP</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components/buttons.css" />
<style>
  .notfound-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: var(--space-6);
  }
  .notfound-code { font-family: var(--font-display); font-size: 5rem; font-weight: 700; color: var(--color-emerald-700); line-height: 1; margin-bottom: var(--space-4); }
  .notfound-screen h1 { margin-bottom: var(--space-2); }
  .notfound-screen p { max-width: 360px; margin-bottom: var(--space-6); }
</style>
</head>
<body>
<main class="notfound-screen">
  <div class="notfound-code">404</div>
  <h1>Page not found</h1>
  <p class="text-muted">The page you're looking for doesn't exist or may have been moved.</p>
  <a href="index.html" class="btn btn-primary">Return to ERP</a>
</main>
</body>
</html>
