  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Attendance</h1>
          <span class="page-head__desc">View your child's attendance record.</span>
        </div>
      </div>

            <thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead>
            <tbody id="attendance-tbody"></tbody>
          </table>
        </div>
        <div id="attendance-pagination"></div>
      </div>
    </main>
