<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prefects — Mercy T International College (MIC) ERP</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/components/sidebar.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/forms.css" />
  <link rel="stylesheet" href="css/components/tables.css" />
  <link rel="stylesheet" href="css/components/badges.css" />
  <link rel="stylesheet" href="css/components/modal.css" />
  <link rel="stylesheet" href="css/components/alerts.css" />
  <link rel="stylesheet" href="css/components/loader.css" />
  <link rel="stylesheet" href="css/pages/academics.css" />
</head>
<body data-page-title="Prefects" data-workspace="admin">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div class="sidebar-overlay" aria-hidden="true"></div>

    <div class="app-main">
      <div id="app-navbar"></div>

      <main class="app-content">
        <div class="page-head">
          <div class="page-head__title">
            <h1>Prefects & Student Leaders</h1>
            <span class="page-head__desc">Track active student leadership roles across sessions and classes.</span>
          </div>
          <div class="page-actions">
            <button id="add-position-btn" class="btn btn-primary">Add position</button>
            <button id="assign-prefect-btn" class="btn btn-secondary">Assign prefect</button>
          </div>
        </div>

        <section class="stats-grid">
          <div class="stat-card">
            <span class="stat-card__label">Positions</span>
            <strong id="positions-count">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Active assignments</span>
            <strong id="assignments-count">0</strong>
          </div>
        </section>

        <div class="table-wrap">
          <div class="table-toolbar">
            <strong>Current prefect assignments</strong>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Position</th>
                  <th>Class</th>
                  <th>Session</th>
                  <th>Status</th>
                  <th>Assigned by</th>
                </tr>
              </thead>
              <tbody id="prefects-table-body">
                <tr>
                  <td colspan="6" class="muted-text">Loading prefect records…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <div class="app-footer-note">Mercy T International College (MIC) ERP</div>
    </div>
  </div>

  <script src="js/config/api.js"></script>
  <script src="js/config/endpoints.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/validators.js"></script>
  <script src="js/utils/permissions.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/services/auth.js"></script>
  <script src="js/services/classes.js"></script>
  <script src="js/services/academic-sessions.js"></script>
  <script src="js/services/students.js"></script>
  <script src="js/services/prefects.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/loader.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/auth/auth-guard.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/prefects.js"></script>
</body>
</html>
