<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timetable — Mercy T International College (MIC) ERP</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/responsive.css" />

<link rel="stylesheet" href="../../css/components/sidebar.css" />
<link rel="stylesheet" href="../../css/components/navbar.css" />
<link rel="stylesheet" href="../../css/components/buttons.css" />
<link rel="stylesheet" href="../../css/components/forms.css" />
<link rel="stylesheet" href="../../css/components/tables.css" />
<link rel="stylesheet" href="../../css/components/badges.css" />
<link rel="stylesheet" href="../../css/components/modal.css" />
<link rel="stylesheet" href="../../css/components/alerts.css" />
<link rel="stylesheet" href="../../css/components/pagination.css" />
<link rel="stylesheet" href="../../css/components/loader.css" />
<link rel="stylesheet" href="../../css/pages/academics.css" />
</head>
<body data-page-title="Timetable" data-workspace="admin">

<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Timetable</h1>
          <span class="page-head__desc">Upload a timetable for each class. The All Classes view combines the active timetables for the current term.</span>
        </div>
      </div>
      <section class="table-wrap" id="timetable-upload-panel">
        <div class="table-toolbar">
          <strong>Upload or replace a class timetable</strong>
        </div>
        <form id="timetable-upload-form" class="form-grid" style="padding: 16px; gap: 12px;">
          <label>Class
            <select id="timetable-upload-class" required>
              <option value="">Select a class</option>
            </select>
          </label>
          <label>Timetable file (JPG, PNG, WEBP, or PDF; maximum 5 MB)
            <input id="timetable-upload-file" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf" required />
          </label>
          <div><button type="submit" class="btn btn-primary" id="timetable-upload-submit">Upload timetable</button></div>
        </form>
      </section>
      <div class="table-wrap">
        <div class="table-toolbar">
          <label for="filter-class">General timetable</label>
          <select id="filter-class" style="min-width:200px;">
            <option value="">All Classes (combined)</option>
          </select>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Class</th><th>Session and term</th><th>Timetable</th><th>Last updated</th></tr></thead>
            <tbody id="timetable-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="app-footer-note">Mercy T International College (MIC) ERP</div>
  </div>
</div>

<script src="../../js/config/api.js"></script>
<script src="../../js/config/endpoints.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/format-date.js"></script>
<script src="../../js/utils/format-currency.js"></script>
<script src="../../js/utils/validators.js"></script>
<script src="../../js/utils/helpers.js"></script>
<script src="../../js/utils/permissions.js"></script>
<script src="../../js/api/api-client.js"></script>
<script src="../../js/services/classes.js"></script>
<script src="../../js/services/subjects.js"></script>
<script src="../../js/services/teachers.js"></script>
<script src="../../js/services/timetable.js"></script>
<script src="../../js/services/auth.js"></script>
<script src="../../js/components/toast.js"></script>
<script src="../../js/components/loader.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/confirm-dialog.js"></script>
<script src="../../js/components/pagination.js"></script>
<script src="../../js/components/dropdown.js"></script>
<script src="../../js/components/notification.js"></script>
<script src="../../js/components/table.js"></script>
<script src="../../js/components/simple-crud.js"></script>
<script src="../../js/components/sidebar.js"></script>
<script src="../../js/components/navbar.js"></script>
<script src="../../js/auth/auth-guard.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/pages/timetable.js"></script>
</body>
</html>
