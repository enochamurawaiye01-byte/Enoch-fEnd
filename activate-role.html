<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Activate Role — Mercy T International College (MIC) ERP</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/alerts.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .activation-shell { width: min(100%, 480px); }
    .activation-shell h1 { margin: 0 0 8px; font-size: 24px; }
    .activation-shell p { line-height: 1.55; }
    #activation-status { min-height: 48px; }
  </style>
</head>
<body>
  <main class="activation-shell">
    <h1>Activate Assigned Role</h1>
    <p id="activation-status" role="status" aria-live="polite">Checking your sign-in status…</p>
    <a id="activation-login-link" class="btn btn-primary" href="login.html" hidden>Sign In</a>
    <button id="activate-role-button" class="btn btn-primary" type="button" hidden>Activate Role</button>
    <a id="activation-dashboard-link" class="btn btn-outline" href="index.html" hidden>Return to ERP</a>
  </main>
  <script src="js/config/api.js"></script>
  <script src="js/config/endpoints.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/permissions.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/services/auth.js"></script>
  <script src="js/services/roles.js"></script>
  <script src="js/pages/activate-role.js"></script>
</body>
</html>
