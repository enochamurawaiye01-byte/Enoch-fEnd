<body data-page-title="Transcripts" data-workspace="admin">

<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Transcripts</h1>
          <span class="page-head__desc">Search a student to view and print their academic transcript.</span>
        </div>
      </div>

      <div class="transcript-search-wrap">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="transcript-student-search" placeholder="Search by student name or reg. number…" />
        </div>
        <div class="search-result-list" id="transcript-search-results" hidden></div>
      </div>

      <div id="transcript-viewer">
        <div class="table-state"><p>Search for a student above to view their transcript.</p></div>
      </div>
    </main>

    <div class="app-footer-note">Enoch International College ERP</div>
  </div>
</div>
