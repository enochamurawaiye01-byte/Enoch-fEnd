<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Logs — Mercy T College Nursery and Primary School</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/responsive.css" />
<link rel="stylesheet" href="../../css/dark-mode.css" />
<link rel="stylesheet" href="../../css/components/sidebar.css" />
<link rel="stylesheet" href="../../css/components/navbar.css" />
<link rel="stylesheet" href="../../css/components/buttons.css" />
<link rel="stylesheet" href="../../css/components/tables.css" />
<link rel="stylesheet" href="../../css/components/badges.css" />
<link rel="stylesheet" href="../../css/components/alerts.css" />
<link rel="stylesheet" href="../../css/components/pagination.css" />
<link rel="stylesheet" href="../../css/components/loader.css" />
</head>
<body data-page-title="Audit Logs" data-workspace="admin">
<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="sidebar-overlay" aria-hidden="true"></div>
  <div class="app-main">
    <div id="app-navbar"></div>
    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1 style="color:#1b2a4a;">System Audit Logs</h1>
          <span class="page-head__desc">Track actions performed by administrators, teachers, and staff members across the ERP.</span>
        </div>
      </div>
      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="search-field"><input type="search" id="audit-logs-search" placeholder="Search by user name, action, or description..." /></div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Performed By</th>
                <th>Role</th>
                <th>Action</th>
                <th>Entity / Module</th>
                <th>Description</th>
                <th style="text-align:right">Timestamp</th>
              </tr>
            </thead>
            <tbody id="audit-logs-tbody"></tbody>
          </table>
        </div>
        <div id="audit-logs-pagination"></div>
      </div>
    </main>
    <div class="app-footer-note">&copy; Mercy T College Nursery and Primary School</div>
  </div>
</div>
<script src="../../js/config/api.js"></script><script src="../../js/config/endpoints.js"></script><script src="../../js/utils/storage.js"></script><script src="../../js/utils/format-date.js"></script><script src="../../js/utils/helpers.js"></script><script src="../../js/utils/permissions.js"></script><script src="../../js/utils/validators.js"></script><script src="../../js/api/api-client.js"></script><script src="../../js/services/auth.js"></script>
<script src="../../js/components/toast.js"></script><script src="../../js/components/loader.js"></script><script src="../../js/components/pagination.js"></script><script src="../../js/components/table.js"></script><script src="../../js/components/sidebar.js"></script><script src="../../js/components/navbar.js"></script><script src="../../js/auth/auth-guard.js"></script><script src="../../js/main.js"></script><script src="../../js/pages/audit-logs.js"></script>
</body>
</html>
