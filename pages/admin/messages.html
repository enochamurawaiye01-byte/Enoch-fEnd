<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — Enoch International College ERP</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/responsive.css" />
<link rel="stylesheet" href="../../css/dark-mode.css" />
<link rel="stylesheet" href="../../css/components/sidebar.css" />
<link rel="stylesheet" href="../../css/components/navbar.css" />
<link rel="stylesheet" href="../../css/components/buttons.css" />
<link rel="stylesheet" href="../../css/components/forms.css" />
<link rel="stylesheet" href="../../css/components/tables.css" />
<link rel="stylesheet" href="../../css/components/badges.css" />
<link rel="stylesheet" href="../../css/components/modal.css" />
<link rel="stylesheet" href="../../css/components/alerts.css" />
<link rel="stylesheet" href="../../css/components/pagination.css" />
<link rel="stylesheet" href="../../css/components/loader.css" />
<link rel="stylesheet" href="../../css/pages/facilities.css" />
<link rel="stylesheet" href="../../css/pages/communication.css" />
</head>
<body data-page-title="Messages" data-workspace="admin">

<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Messages</h1>
          <span class="page-head__desc">Direct messages between staff, students and parents.</span>
        </div>
        <div class="page-head__actions">
          <button type="button" class="btn btn-primary" id="compose-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Compose
          </button>
        </div>
      </div>
      <div class="tab-bar">
        <button type="button" class="tab-btn active" data-tab-target="tab-inbox">Inbox</button>
        <button type="button" class="tab-btn" data-tab-target="tab-sent">Sent</button>
      </div>
      <div class="tab-panel" id="tab-inbox">
        <div class="table-wrap"><div class="table-scroll"><table class="data-table">
          <thead><tr><th>From</th><th>Subject</th><th>Date</th></tr></thead>
          <tbody id="inbox-tbody"></tbody>
        </table></div><div id="inbox-pagination"></div></div>
      </div>
      <div class="tab-panel" id="tab-sent" hidden>
        <div class="table-wrap"><div class="table-scroll"><table class="data-table">
          <thead><tr><th>To</th><th>Subject</th><th>Date</th></tr></thead>
          <tbody id="sent-tbody"></tbody>
        </table></div><div id="sent-pagination"></div></div>
      </div>
    </main>

    <div class="app-footer-note">Enoch International College ERP</div>
  </div>
</div>

<script src="../../js/config/api.js"></script>
<script src="../../js/config/endpoints.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/format-date.js"></script>
<script src="../../js/utils/format-currency.js"></script>
<script src="../../js/utils/validators.js"></script>
<script src="../../js/utils/helpers.js"></script>
<script src="../../js/utils/permissions.js"></script>
<script src="../../js/api/api-client.js"></script>
<script src="../../js/services/messages.js"></script>
<script src="../../js/services/auth.js"></script>
<script src="../../js/components/toast.js"></script>
<script src="../../js/components/loader.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/confirm-dialog.js"></script>
<script src="../../js/components/pagination.js"></script>
<script src="../../js/components/dropdown.js"></script>
<script src="../../js/components/notification.js"></script>
<script src="../../js/components/table.js"></script>
<script src="../../js/components/simple-crud.js"></script>
<script src="../../js/components/sidebar.js"></script>
<script src="../../js/components/navbar.js"></script>
<script src="../../js/auth/auth-guard.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/pages/messages.js"></script>
</body>
</html>
