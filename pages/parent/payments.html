<head>
<meta charset="UTF-8" />

<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/responsive.css" />

<body data-page-title="Payments" data-workspace="parent">

<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Payments</h1>
          <span class="page-head__desc">Make and review fee payments for your child.</span>
        </div>
        <div class="page-head__actions">
          <button type="button" class="btn btn-primary" id="make-payment-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Make a Payment
          </button>
        </div>
      </div>
      <div class="child-picker"><select id="child-select"><option value="">Loading…</option></select></div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Amount</th><th>Method</th><th>Reference</th><th>Date</th></tr></thead>
            <tbody id="payments-tbody"></tbody>
          </table>
        </div>
        <div id="payments-pagination"></div>
      </div>
    </main>

    <div class="app-footer-note">Enoch International College ERP</div>
  </div>
</div>
