<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — Enoch International College ERP</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dark-mode.css" />
<link rel="stylesheet" href="css/components/buttons.css" />
<link rel="stylesheet" href="css/components/forms.css" />
<link rel="stylesheet" href="css/components/alerts.css" />
<link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>

<main class="auth-screen">
  <section class="auth-brand-panel">
    <div class="auth-brand-mark">EIC</div>
    <div class="auth-brand-copy">
      <h2>Enoch International College</h2>
      <p>Enterprise Resource Planning system for academic, financial and administrative management.</p>
    </div>
    <div class="auth-brand-foot">&copy; <span id="year-brand"></span> Enoch International College. All rights reserved.</div>
  </section>

  <section class="auth-form-panel">
    <div class="auth-card">
      <a href="login.html" class="auth-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        Back to sign in
      </a>

      <div class="auth-card-head">
        <div class="auth-mobile-mark">EIC</div>
        <h1>Reset your password</h1>
        <p>Enter your registered email and we'll send you a reset link.</p>
      </div>

      <div class="alert alert-error auth-alert" id="forgot-error" role="alert" hidden></div>
      <div class="alert alert-success auth-alert" id="forgot-success" role="status" hidden></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="identifier" class="form-label">Email</label>
          <input type="email" id="identifier" name="identifier" autocomplete="email" placeholder="you@enochcollege.edu.ng" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgot-submit">Send Reset Link</button>
      </form>
    </div>
  </section>
</main>

<script>document.getElementById('year-brand').textContent = new Date().getFullYear();</script>

<script src="js/config/api.js"></script>
<script src="js/config/endpoints.js"></script>
<script src="js/utils/storage.js"></script>
<script src="js/utils/helpers.js"></script>
<script src="js/utils/validators.js"></script>
<script src="js/api/api-client.js"></script>
<script src="js/services/auth.js"></script>
<script src="js/auth/forgot-password.js"></script>
</body>
</html>
