<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Registration — Enoch International College</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dark-mode.css" />
<link rel="stylesheet" href="css/components/forms.css" />
<link rel="stylesheet" href="css/components/buttons.css" />
<link rel="stylesheet" href="css/components/alerts.css" />
<link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>
<main class="auth-screen">
  <button type="button" class="auth-theme-toggle" id="auth-theme-toggle">
    <span id="theme-toggle-label">Dark Mode</span>
  </button>
  <section class="auth-form-panel">
    <div class="auth-card">
      <div class="auth-school-intro"><strong>Enoch International College</strong><span>Connect your parent account to your child's verified school record.</span></div>
      <div class="auth-card-head"><h1>Parent registration</h1><p>Applications require administrator approval before sign-in.</p></div>
      <div class="alert alert-error auth-alert" id="parent-register-error" role="alert" hidden></div>
      <div class="alert alert-success auth-alert" id="parent-register-success" role="status" hidden></div>
      <form id="parent-register-form" class="auth-form" novalidate>
        <div class="form-group"><label class="form-label" for="childRegistrationNumber">Child registration number</label><input id="childRegistrationNumber" name="childRegistrationNumber" placeholder="EIC-2026-00001" required /></div>
        <div class="form-row"><div class="form-group"><label class="form-label" for="firstName">First name</label><input id="firstName" name="firstName" required /></div><div class="form-group"><label class="form-label" for="lastName">Last name</label><input id="lastName" name="lastName" required /></div></div>
        <div class="form-group"><label class="form-label" for="relationship">Relationship to child</label><input id="relationship" name="relationship" placeholder="Parent or guardian" required /></div>
        <div class="form-group"><label class="form-label" for="occupation">Occupation</label><input id="occupation" name="occupation" /></div>
        <div class="form-group"><label class="form-label" for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" required /></div>
        <div class="form-group"><label class="form-label" for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" required /></div>
        <div class="form-group"><label class="form-label" for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required /></div>
          <div class="form-group"><label for="phoneNumber" class="form-label">Phone number</label><input type="tel" id="phoneNumber" name="phoneNumber" required /></div>
          <div class="form-group"><label for="address" class="form-label">Address</label><textarea id="address" name="address" rows="2"></textarea></div>
        <div class="form-group" style="display:flex; align-items:center; gap:8px; margin:14px 0;">
          <input type="checkbox" id="marketingConsent" name="marketingConsent" checked style="width:16px; height:16px; cursor:pointer;" />
          <label for="marketingConsent" style="font-size:13px; color:#94a3b8; margin:0; cursor:pointer;">Keep me updated with Enoch International College admission news and updates.</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="parent-register-submit">Submit parent application</button>
      </form>
      <p class="auth-form-foot"><span>Already approved?</span><a href="login.html">Sign in</a></p>
    </div>
  </section>
</main>
<script src="js/utils/storage.js"></script>
<script>
  (function () {
    const currentTheme = Storage.getTheme();
    document.documentElement.setAttribute('data-theme', currentTheme);
    const themeBtn = document.getElementById('auth-theme-toggle');
    const themeLabel = document.getElementById('theme-toggle-label');
    if (themeBtn && themeLabel) {
      themeLabel.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
      themeBtn.addEventListener('click', () => {
        const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        Storage.setTheme(nextTheme);
        themeLabel.textContent = nextTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
      });
    }
  })();
</script>
<script src="js/config/api.js"></script>
<script src="js/config/endpoints.js"></script>
<script src="js/utils/storage.js"></script>
<script src="js/utils/helpers.js"></script>
<script src="js/utils/validators.js"></script>
<script src="js/api/api-client.js"></script>
<script src="js/services/auth.js"></script>
<script src="js/auth/parent-register.js"></script>
</body>
</html>
