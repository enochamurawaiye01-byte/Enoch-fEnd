  <div class="sidebar-overlay" aria-hidden="true"></div>

  <div class="app-main">
    <div id="app-navbar"></div>

    <main class="app-content">
      <div class="page-head">
        <div class="page-head__title">
          <h1>Exam Attempts</h1>
          <span class="page-head__desc">Review student examination attempts and scores.</span>
        </div>
      </div>

        <div class="table-toolbar">
          <select id="filter-examination" style="min-width:220px;"><option value="">All Examinations</option></select>

          <table class="data-table">
            <thead><tr><th>Student</th><th>Examination</th><th>Score</th><th>Status</th><th>Submitted</th></tr></thead>
            <tbody id="attempts-tbody"></tbody>
          </table>
        </div>
        <div id="attempts-pagination"></div>
      </div>
    </main>
